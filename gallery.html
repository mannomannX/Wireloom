<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireloom Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M3 9h18M9 21V9'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      
      /* Light Theme (shadcn standard) */
      --background: #ffffff;
      --foreground: #09090b;
      --card: #ffffff;
      --card-foreground: #09090b;
      --primary: #18181b;
      --primary-foreground: #fafafa;
      --secondary: #f4f4f5;
      --secondary-foreground: #18181b;
      --muted: #f4f4f5;
      --muted-foreground: #71717a;
      --border: #e4e4e7;
      --border-subtle: #f0f0f2;
      --input: #e4e4e7;
      --accent: #f4f4f5;
      --accent-foreground: #18181b;
      --error-bg: #fef2f2;
      --error-border: #fca5a5;
      --error-text: #b91c1c;
      --canvas-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    html.dark {
      /* Dark Theme (shadcn standard) */
      --background: #09090b;
      --foreground: #fafafa;
      --card: #09090b;
      --card-foreground: #fafafa;
      --primary: #fafafa;
      --primary-foreground: #18181b;
      --secondary: #27272a;
      --secondary-foreground: #fafafa;
      --muted: #18181b;
      --muted-foreground: #a1a1aa;
      --border: #27272a;
      --border-subtle: #1e1e22;
      --input: #27272a;
      --accent: #27272a;
      --accent-foreground: #fafafa;
      --error-bg: #450a0a;
      --error-border: #991b1b;
      --error-text: #fecaca;
      --canvas-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--background);
      color: var(--foreground);
      height: 100vh;
      max-width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* ----------------------------------------------------------------------- */
    /* Header (just-lsp clean bar)                                             */
    /* ----------------------------------------------------------------------- */
    .top-header {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      gap: 0.5rem;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--foreground);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .brand-version {
      font-size: 0.75rem;
      color: var(--muted-foreground);
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      padding: 0.35rem 0.65rem;
      cursor: pointer;
      border: 1px solid transparent;
      outline: none;
      text-decoration: none;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted-foreground);
    }

    .btn-ghost:hover {
      background: var(--muted);
      color: var(--foreground);
    }

    .btn-outline {
      background: var(--background);
      border-color: var(--border);
      color: var(--foreground);
    }

    .btn-outline:hover {
      background: var(--muted);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 600;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-icon {
      padding: 0.35rem;
      height: 30px;
      width: 30px;
    }

    .btn-icon svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
    }

    /* ----------------------------------------------------------------------- */
    /* Main Layout Workspace (p-4 pt-0, rounded border box)                    */
    /* ----------------------------------------------------------------------- */
    .workspace-wrapper {
      flex: 1;
      overflow: hidden;
      padding: 0 1rem 1rem 1rem;
      display: flex;
    }

    .workspace-box {
      flex: 1;
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
      --split-ratio: 50%;
    }

    /* Editor Pane */
    .editor-pane {
      width: var(--split-ratio);
      min-width: 250px;
      max-width: 80%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--card);
    }

    /* Draggable Splitter Handle */
    .drag-handle {
      width: 1px;
      background: var(--border);
      position: relative;
      cursor: col-resize;
      transition: background-color 0.15s;
      z-index: 10;
    }

    .drag-handle::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -3px;
      right: -3px;
      background: transparent;
    }

    .drag-handle:hover, .drag-handle:active {
      background: var(--foreground);
      width: 2px;
    }

    /* Preview Pane */
    .preview-pane {
      flex: 1;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--muted);
      position: relative;
    }

    /* Pane Header Strip */
    .pane-header {
      height: 32px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.75rem;
      font-size: 0.75rem;
      color: var(--muted-foreground);
      font-family: var(--font-mono);
    }

    .pane-header-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tool-link {
      background: none;
      border: none;
      color: var(--muted-foreground);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      cursor: pointer;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
    }

    .tool-link:hover {
      color: var(--foreground);
      background: var(--muted);
    }

    /* ----------------------------------------------------------------------- */
    /* Editor Body                                                             */
    /* ----------------------------------------------------------------------- */
    .editor-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .gutter {
      width: 40px;
      padding: 0.75rem 0.4rem 0.75rem 0;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--muted-foreground);
      opacity: 0.5;
      user-select: none;
      border-right: 1px solid var(--border-subtle);
      overflow: hidden;
      background: var(--card);
    }

    .gutter-num {
      height: 1.5em;
    }

    .gutter-num.error {
      color: #ef4444;
      opacity: 1;
      font-weight: 700;
    }

    textarea.editor-input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.5;
      padding: 0.75rem 0.75rem;
      resize: none;
      outline: none;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* Error Bar */
    .error-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--error-bg);
      border-top: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 0.4rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      display: none;
      z-index: 15;
    }

    .error-bar.visible {
      display: block;
    }

    /* ----------------------------------------------------------------------- */
    /* SVG Canvas Viewport                                                     */
    /* ----------------------------------------------------------------------- */
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .canvas-stage {
      position: absolute;
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
      pointer-events: auto;
    }

    .canvas-stage svg {
      display: block;
      box-shadow: var(--canvas-shadow);
      border-radius: 4px;
    }

    /* Floating Zoom HUD */
    .zoom-hud {
      position: absolute;
      bottom: 0.75rem;
      right: 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.15rem 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.15rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }

    .hud-btn {
      background: transparent;
      border: none;
      color: var(--muted-foreground);
      padding: 0.2rem 0.35rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .hud-btn:hover {
      background: var(--muted);
      color: var(--foreground);
    }

    .hud-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--foreground);
      color: var(--background);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: all 0.15s ease;
      z-index: 100;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .workspace-box {
        flex-direction: column;
      }
      .editor-pane {
        width: 100% !important;
        height: 50%;
        max-width: none;
      }
      .drag-handle {
        width: 100%;
        height: 1px;
        cursor: row-resize;
      }
      .preview-pane {
        height: 50%;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Top Header -->
  <header class="top-header">
    <a href="#" class="brand-title">Wireloom</a>
    <span class="brand-version">v0.8.0</span>

    <div class="header-actions">
      <!-- Theme Toggle Icon -->
      <button id="theme-btn" class="btn btn-ghost btn-icon" title="Toggle Theme">
        <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>

      <!-- Copy SVG -->
      <button id="copy-btn" class="btn btn-primary" title="Copy SVG code">
        Copy SVG
      </button>

      <!-- Download SVG -->
      <button id="download-btn" class="btn btn-outline" title="Download SVG">
        Download SVG
      </button>

      <!-- Export PNG -->
      <button id="export-png-btn" class="btn btn-outline" title="Export PNG (2x)">
        Export PNG
      </button>

      <!-- GitHub -->
      <a href="https://github.com/mannomannX/Wireloom" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-icon" title="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
      </a>
    </div>
  </header>

  <!-- Workspace Card -->
  <div class="workspace-wrapper">
    <div class="workspace-box" id="workspace-box">
      
      <!-- Editor Pane -->
      <div class="editor-pane" id="editor-pane">
        <div class="pane-header">
          <span>editor</span>
          <div class="pane-header-actions">
            <button id="format-btn" class="tool-link" title="Format indentation">format</button>
            <button id="clear-btn" class="tool-link" title="Clear">clear</button>
            <span id="perf-badge" style="margin-left: 0.3rem;">⚡ 0.0ms</span>
          </div>
        </div>

        <div class="editor-body">
          <div class="gutter" id="gutter"></div>
          <textarea id="editor-input" class="editor-input" spellcheck="false" placeholder="window:&#10;  text &quot;Hello&quot;"></textarea>
          <div id="error-bar" class="error-bar"></div>
        </div>
      </div>

      <!-- Divider -->
      <div class="drag-handle" id="drag-handle"></div>

      <!-- Preview Pane -->
      <div class="preview-pane" id="preview-pane">
        <div class="pane-header">
          <span>preview</span>
          <span id="dim-badge">0 × 0 px</span>
        </div>

        <div class="viewport" id="viewport">
          <div class="canvas-stage" id="canvas-stage"></div>

          <!-- Zoom Controls HUD -->
          <div class="zoom-hud">
            <button id="zoom-fit-btn" class="hud-btn" title="Fit">Fit</button>
            <button id="zoom-reset-btn" class="hud-btn" title="1:1">1:1</button>
            <button id="zoom-out-btn" class="hud-btn" title="Zoom Out">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <span id="zoom-badge" style="font-size: 0.7rem; color: var(--muted-foreground); padding: 0 0.2rem;">100%</span>
            <button id="zoom-in-btn" class="hud-btn" title="Zoom In">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./gallery.js"></script>
</body>
</html>
