<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireloom Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M3 9h18M9 21V9'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      
      /* Light Theme (shadcn standard) */
      --background: #ffffff;
      --foreground: #09090b;
      --card: #ffffff;
      --card-foreground: #09090b;
      --primary: #18181b;
      --primary-foreground: #fafafa;
      --secondary: #f4f4f5;
      --secondary-foreground: #18181b;
      --muted: #f4f4f5;
      --muted-foreground: #71717a;
      --border: #e4e4e7;
      --border-subtle: #f0f0f2;
      --input: #e4e4e7;
      --accent: #f4f4f5;
      --accent-foreground: #18181b;
      --error-bg: #fef2f2;
      --error-border: #fca5a5;
      --error-text: #b91c1c;
      --canvas-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.05);

      /* Syntax Highlighting Light */
      --hl-keyword: #7c3aed;
      --hl-macro: #0284c7;
      --hl-container: #1d4ed8;
      --hl-primitive: #0f766e;
      --hl-attr: #c2410c;
      --hl-string: #15803d;
      --hl-num: #0369a1;
      --hl-var: #be123c;
      --hl-flag: #6d28d9;
      --hl-comment: #94a3b8;
    }

    html.dark {
      /* Dark Theme (shadcn standard) */
      --background: #09090b;
      --foreground: #fafafa;
      --card: #09090b;
      --card-foreground: #fafafa;
      --primary: #fafafa;
      --primary-foreground: #18181b;
      --secondary: #27272a;
      --secondary-foreground: #fafafa;
      --muted: #18181b;
      --muted-foreground: #a1a1aa;
      --border: #27272a;
      --border-subtle: #1e1e22;
      --input: #27272a;
      --accent: #27272a;
      --accent-foreground: #fafafa;
      --error-bg: #450a0a;
      --error-border: #991b1b;
      --error-text: #fecaca;
      --canvas-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);

      /* Syntax Highlighting Dark */
      --hl-keyword: #c084fc;
      --hl-macro: #38bdf8;
      --hl-container: #60a5fa;
      --hl-primitive: #2dd4bf;
      --hl-attr: #fb923c;
      --hl-string: #fde047;
      --hl-num: #38bdf8;
      --hl-var: #f43f5e;
      --hl-flag: #a78bfa;
      --hl-comment: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--background);
      color: var(--foreground);
      height: 100vh;
      max-width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* ----------------------------------------------------------------------- */
    /* Header                                                                  */
    /* ----------------------------------------------------------------------- */
    .top-header {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      gap: 0.5rem;
      font-family: var(--font-sans);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--foreground);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .brand-version {
      font-size: 0.75rem;
      color: var(--muted-foreground);
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: var(--font-sans);
      padding: 0.35rem 0.65rem;
      cursor: pointer;
      border: 1px solid transparent;
      outline: none;
      text-decoration: none;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn-sm {
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      border-radius: 6px;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted-foreground);
    }

    .btn-ghost:hover {
      background: var(--muted);
      color: var(--foreground);
    }

    .btn-outline {
      background: var(--background);
      border-color: var(--border);
      color: var(--foreground);
    }

    .btn-outline:hover {
      background: var(--muted);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 600;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-icon {
      padding: 0.35rem;
      height: 30px;
      width: 30px;
    }

    .btn-icon svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--muted);
      color: var(--muted-foreground);
      font-size: 0.74rem;
      font-family: var(--font-sans);
      font-weight: 500;
    }

    .badge-pill svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      flex-shrink: 0;
    }

    /* ----------------------------------------------------------------------- */
    /* Main Layout Workspace                                                   */
    /* ----------------------------------------------------------------------- */
    .workspace-wrapper {
      flex: 1;
      overflow: hidden;
      padding: 0 1rem 1rem 1rem;
      display: flex;
    }

    .workspace-box {
      flex: 1;
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
      --split-ratio: 50%;
    }

    /* Editor Pane */
    .editor-pane {
      width: var(--split-ratio);
      min-width: 250px;
      max-width: 80%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--card);
    }

    /* Draggable Splitter Handle */
    .drag-handle {
      width: 1px;
      background: var(--border);
      position: relative;
      cursor: col-resize;
      transition: background-color 0.15s;
      z-index: 10;
    }

    .drag-handle::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -3px;
      right: -3px;
      background: transparent;
    }

    .drag-handle:hover, .drag-handle:active {
      background: var(--foreground);
      width: 2px;
    }

    /* Preview Pane */
    .preview-pane {
      flex: 1;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--muted);
      position: relative;
    }

    /* Pane Header Strip */
    .pane-header {
      height: 40px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.85rem;
      font-family: var(--font-sans);
    }

    .pane-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--foreground);
    }

    .pane-header-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ----------------------------------------------------------------------- */
    /* Syntax-Highlighted Editor Body                                          */
    /* ----------------------------------------------------------------------- */
    .editor-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .gutter {
      width: 40px;
      padding: 0.75rem 0.4rem 0.75rem 0;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--muted-foreground);
      opacity: 0.5;
      user-select: none;
      border-right: 1px solid var(--border-subtle);
      overflow: hidden;
      background: var(--card);
      flex-shrink: 0;
    }

    .gutter-num {
      height: 1.55em;
    }

    .gutter-num.error {
      color: #ef4444;
      opacity: 1;
      font-weight: 700;
    }

    .editor-content-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Syntax Highlighting Layers */
    .highlight-layer, textarea.editor-input {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.75rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.55;
      letter-spacing: 0;
      tab-size: 2;
      white-space: pre;
      word-wrap: normal;
      border: none;
      box-sizing: border-box;
      overflow: auto;
    }

    .highlight-layer {
      pointer-events: none;
      color: var(--foreground);
      background: transparent;
      z-index: 1;
    }

    .highlight-layer pre, .highlight-layer code {
      margin: 0;
      padding: 0;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      white-space: pre;
      background: transparent;
    }

    textarea.editor-input {
      background: transparent;
      color: transparent;
      caret-color: var(--foreground);
      resize: none;
      outline: none;
      z-index: 2;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    textarea.editor-input::selection {
      background: rgba(56, 189, 248, 0.25);
    }

    /* Syntax Token Classes */
    .hl-keyword { color: var(--hl-keyword); font-weight: 600; }
    .hl-macro { color: var(--hl-macro); font-weight: 600; }
    .hl-container { color: var(--hl-container); font-weight: 600; }
    .hl-primitive { color: var(--hl-primitive); font-weight: 500; }
    .hl-attr { color: var(--hl-attr); }
    .hl-string { color: var(--hl-string); }
    .hl-num { color: var(--hl-num); }
    .hl-var { color: var(--hl-var); font-weight: 600; }
    .hl-flag { color: var(--hl-flag); }
    .hl-comment { color: var(--hl-comment); font-style: italic; }

    /* Error Bar */
    .error-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--error-bg);
      border-top: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 0.4rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      display: none;
      z-index: 15;
    }

    .error-bar.visible {
      display: block;
    }

    /* ----------------------------------------------------------------------- */
    /* Clean Static Preview Viewport                                           */
    /* ----------------------------------------------------------------------- */
    .preview-body {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-color: var(--muted);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .canvas-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
    }

    .canvas-stage svg {
      display: block;
      box-shadow: var(--canvas-shadow);
      border-radius: 4px;
      max-width: 100%;
      height: auto;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--foreground);
      color: var(--background);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      font-family: var(--font-sans);
      pointer-events: none;
      opacity: 0;
      transition: all 0.15s ease;
      z-index: 100;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .workspace-box {
        flex-direction: column;
      }
      .editor-pane {
        width: 100% !important;
        height: 50%;
        max-width: none;
      }
      .drag-handle {
        width: 100%;
        height: 1px;
        cursor: row-resize;
      }
      .preview-pane {
        height: 50%;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Top Header -->
  <header class="top-header">
    <a href="#" class="brand-title">Wireloom</a>
    <span class="brand-version">v0.8.0</span>

    <div class="header-actions">
      <!-- Theme Toggle Icon -->
      <button id="theme-btn" class="btn btn-ghost btn-icon" title="Toggle Theme">
        <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>

      <!-- Copy SVG -->
      <button id="copy-btn" class="btn btn-primary" title="Copy SVG code">
        Copy SVG
      </button>

      <!-- Download SVG -->
      <button id="download-btn" class="btn btn-outline" title="Download SVG">
        Download SVG
      </button>

      <!-- Export PNG -->
      <button id="export-png-btn" class="btn btn-outline" title="Export PNG (2x)">
        Export PNG
      </button>

      <!-- GitHub -->
      <a href="https://github.com/mannomannX/Wireloom" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-icon" title="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
      </a>
    </div>
  </header>

  <!-- Workspace Card -->
  <div class="workspace-wrapper">
    <div class="workspace-box" id="workspace-box">
      
      <!-- Editor Pane -->
      <div class="editor-pane" id="editor-pane">
        <div class="pane-header">
          <span class="pane-title">Editor</span>
          <div class="pane-header-actions">
            <button id="format-btn" class="btn btn-outline btn-sm" title="Format indentation">Format</button>
            <button id="clear-btn" class="btn btn-outline btn-sm" title="Clear">Clear</button>
            <span class="badge-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              <span id="perf-badge">0.0ms</span>
            </span>
          </div>
        </div>

        <div class="editor-body">
          <div class="gutter" id="gutter"></div>
          <div class="editor-content-area">
            <div class="highlight-layer" id="highlight-layer"><code id="highlight-code"></code></div>
            <textarea id="editor-input" class="editor-input" spellcheck="false" placeholder="window:&#10;  text &quot;Hello&quot;"></textarea>
          </div>
          <div id="error-bar" class="error-bar"></div>
        </div>
      </div>

      <!-- Divider -->
      <div class="drag-handle" id="drag-handle"></div>

      <!-- Preview Pane (Clean, Static, Centered) -->
      <div class="preview-pane" id="preview-pane">
        <div class="pane-header">
          <span class="pane-title">Preview</span>
          <div class="pane-header-actions">
            <span id="dim-badge" class="badge-pill">0 × 0 px</span>
          </div>
        </div>

        <div class="preview-body" id="preview-body">
          <div class="canvas-stage" id="canvas-stage"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./gallery.js"></script>
</body>
</html>
